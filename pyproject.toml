[tool.pytest.ini_options]
testpaths = [
    "engine/execution_dry_run/tests",
    "integration",
    "learning/drive_bias/execution_preview/tests",
    "learning/risk_surface/tests",
    "orchestration/tests",
]
norecursedirs = [
    ".git",
    ".pytest_cache",
    ".venv",
    ".venv311",
    "__pycache__",
    "episodes",
    "z artifacts",
    "z testing",
]
python_files = [
    "test_*.py",
]
markers = [
    "rc2_fast: fast RC2 smoke checks suitable for inner-loop validation",
    "rc2_slow: slower RC2 quality or report tests",
    "rc2_integration: RC2 integration tests that exercise multiple subsystems",
    "rc2_report: RC2 report-generation and JSON validation tests",
]
